<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>EarthQuest 3D</title>

    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.29/esri/themes/dark/main.css"
    />
    <script src="https://js.arcgis.com/4.29/"></script>

    <style>
      html,
      body,
      #viewDiv {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: black;
      }
    </style>

    <script>
      // 🔐 Get token injected from React Native
      const token = window.ARC_TOKEN;
      console.log("TOKEN IN HTML:", token);
      // 🚫 Block unauthorized access
      if (!token) {
        document.body.innerHTML = "<h2>Unauthorized</h2>";
        throw new Error("No ArcGIS token provided");
      }

      require([
        "esri/WebScene",
        "esri/views/SceneView",
        "esri/widgets/Search",
        "esri/widgets/Locate",
        "esri/widgets/Compass",
        "esri/widgets/Home",
        "esri/config",
        "esri/layers/GraphicsLayer",
        "esri/Graphic",
      ], function (
        WebScene,
        SceneView,
        Search,
        Locate,
        Compass,
        Home,
        esriConfig,
        GraphicsLayer,
        Graphic,
      ) {
        // 🔥 Attach token to ALL ArcGIS requests
        esriConfig.request.interceptors.push({
          before: function (params) {
            params.requestOptions.query = {
              ...params.requestOptions.query,
              token: token,
            };
          },
        });

        const webscene = new WebScene({
          portalItem: {
            id: "4fda049729b44251b6a9cf49a50a185a",
          },
        });

        const view = new SceneView({
          container: "viewDiv",
          map: webscene,
          qualityProfile: "high",
          padding: {
            top: 60,
          },
        });

        // 📍 Create graphics layer
        const graphicsLayer = new GraphicsLayer();
        view.map.add(graphicsLayer);

        // 📍 Example pin
        const point = {
          type: "point",
          latitude: 42.6867,
          longitude: -73.8238,
        };

        const markerSymbol = {
          type: "point-3d",
          symbolLayers: [
            {
              type: "object",
              resource: { primitive: "cone" },
              material: { color: "red" },
              height: 30,
            },
          ],
        };

        const pointGraphic = new Graphic({
          geometry: point,
          symbol: markerSymbol,
          attributes: {
            id: "adventure1",
            title: "EarthQuest Adventure 1",
            isAdventure: true,
            images: [
              "https://4kwallpapers.com/images/wallpapers/marvels-spider-man-pc-games-playstation-4-playstation-5-1280x1280-8652.jpg",
              "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLWxF_3dpL8AjzxIAs43Hu_PJcEPlsUMwMFQ&s",
              "https://c4.wallpaperflare.com/wallpaper/611/838/413/spiderman-hd-4k-superheroes-wallpaper-preview.jpg",
            ],
          },
        });

        graphicsLayer.add(pointGraphic);

        view.on("click", function (event) {
          view.hitTest(event).then(function (response) {
            const result = response.results.find(
              (r) => r.graphic && r.graphic.attributes,
            );

            if (result) {
              const attrs = result.graphic.attributes;

              window.ReactNativeWebView.postMessage(
                JSON.stringify({
                  type: "PIN_CLICK",
                  data: attrs,
                }),
              );
            }
          });
        });

        // 🔍 Search
        view.ui.add(new Search({ view }), "top-right");

        // 📍 Locate
        view.ui.add(new Locate({ view }), "top-left");

        // 🧭 Compass
        view.ui.add(new Compass({ view }), "top-left");

        // 🏠 Home
        view.ui.add(new Home({ view }), "top-left");
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
  </body>
</html>
