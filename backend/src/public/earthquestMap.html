<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>EarthQuest 3D</title>

    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.29/esri/themes/dark/main.css"
    />
    <script src="https://js.arcgis.com/4.29/"></script>

    <style>
      html,
      body,
      #viewDiv {
        margin: 0;
        height: 100%;
        background: black;
      }
    </style>

    <script>
      const token = window.ARC_TOKEN;
      if (!token) {
        document.body.innerHTML = "<h2>Unauthorized</h2>";
        throw new Error("No token");
      }

      require([
        "esri/WebScene",
        "esri/views/SceneView",
        "esri/widgets/Search",
        "esri/config",
        "esri/layers/GraphicsLayer",
        "esri/Graphic",
      ], function (
        WebScene,
        SceneView,
        Search,
        esriConfig,
        GraphicsLayer,
        Graphic,
      ) {
        esriConfig.request.interceptors.push({
          before: function (params) {
            params.requestOptions.query = {
              ...params.requestOptions.query,
              token: token,
            };
          },
        });

        const view = new SceneView({
          container: "viewDiv",
          map: new WebScene({
            portalItem: { id: "ff34b251dfa44bb7ac5b206d6dadab89" },
          }),
          padding: {
            top: 80,
          },
        });

        const graphicsLayer = new GraphicsLayer();
        view.map.add(graphicsLayer);

        // 🔥 ALL SCENARIOS
        const scenarios = [
          // ===== Scenario F (MULTIPLE LOCATIONS) =====
          {
            lat: 42.752242,
            lon: -73.697130,
            data: {
              id: "EQ1-F-1",
              code: "F",
              title: "Hudson Aquaculture - Troy Dam",
              locationName: "Troy Dam",
              description:
                "Study aquaculture systems and river flow near Troy Dam.",
              images: [
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777512311/F_Troy_Federal_Dam_1_ytm3rr.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777512311/F_Hover_Motorboats_and_Yacht_1_1_q8flaa.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777512310/F_Hover_Motorboats_and_Yacht_3_iufez1.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777512310/F_Hudson_River_1_bbbryp.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777512310/F_Arbor_Hill_River._aquaculture_3_zinfla.jpg",
              ],
              isAdventure: true,
            },
          },
          {
            lat: 42.647310,
            lon: -73.748964,
            data: {
              id: "EQ1-C5",
              code: "C5",
              title: "South Albany Radix Resilience Center",
              locationName: "Resilience Center",
              description:
                "South Albany Radix Resilience Center.",
              images: [
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777511980/C5_Subterranean_Creeks_w_animals_5_gwzwmc.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777511980/C5_Subterranean_Creeks_w_animals_2_muopnu.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777511980/C5_Subterranean_Creeks_w_animals_1_wx4znm.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777511979/C5_Subterranean_Creeks_w_animals_Sheep_luf2zs.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777511979/C5_Subterranean_Creeks_w_animals_Dogs_sur0je.jpg",
              ],
              isAdventure: true,
            },
          },

          // ===== Scenario E1 =====
          {
            lat: 42.731108,
            lon: -73.699864,
            data: {
              id: "EQ1-E1",
              code: "E1",
              title: "Watervliet City Hall",
              locationName: "Watervliet City Hall",
              description: "Handle emergency docking near city hall.",
              images: [
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777512499/E1_Building_and_flooded_streets_1_gprw2n.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777512499/E1_Building_and_flooded_streets_2_qk7ewv.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777512499/E1_Building_and_flooded_streets_3_wcenqe.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777512497/E1_Building_and_flooded_streets_4_kor1ad.jpg",
                "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777512496/E1_Building_and_flooded_streets_5_qcqzwq.jpg",
              ],
              isAdventure: true,
            },
          },
        ];

        const markerSymbol = {
          type: "point-3d",
          symbolLayers: [
            {
              type: "icon",
              resource: {
                href: "https://res.cloudinary.com/dtcadnjtg/image/upload/v1777244825/5b268d65-8a11-4232-9ea2-b53984f84b51_ayyezx.jpg",
              },
              size: 20,
            },
          ],
        };

        // 🔥 ADD ALL PINS
        scenarios.forEach((s) => {
          const graphic = new Graphic({
            geometry: {
              type: "point",
              latitude: s.lat,
              longitude: s.lon,
              z: 10,
            },
            symbol: markerSymbol,
            attributes: s.data,
          });

          graphicsLayer.add(graphic);
        });

        // 🔥 CLICK HANDLER
        view.on("click", function (event) {
          view.hitTest(event).then(function (response) {
            const result = response.results.find(
              (r) => r.graphic?.attributes?.isAdventure,
            );

            if (result) {
              window.ReactNativeWebView.postMessage(
                JSON.stringify({
                  type: "PIN_CLICK",
                  data: result.graphic.attributes,
                }),
              );
            }
          });
        });

        // 🔍 IMPROVED SEARCH
        const searchWidget = new Search({
          view: view,

          // 🔥 Keep BOTH default + custom
          includeDefaultSources: true,

          sources: [
            {
              name: "EarthQuest Scenarios",
              placeholder: "Search Watervliet, South Albany, Hudson Aquaculture...",

              // 🔥 IMPORTANT
              // Tell ArcGIS this is NOT a normal locator
              getSuggestions: (params) => {
                const term = params.suggestTerm?.toLowerCase() || "";

                return scenarios
                  .filter(
                    (s) =>
                      s.data.code.toLowerCase().includes(term) ||
                      s.data.title.toLowerCase().includes(term) ||
                      s.data.locationName.toLowerCase().includes(term),
                  )
                  .map((s) => ({
                    key: s.data.id,
                    text: `${s.data.code} - ${s.data.title} (${s.data.locationName})`,
                    sourceIndex: 1, // 🔥 REQUIRED when default sources exist
                  }));
              },

              getResults: (params) => {
                let match;

                // 🔥 handle BOTH cases
                if (params.suggestResult) {
                  match = scenarios.find(
                    (s) => s.data.id === params.suggestResult.key,
                  );
                } else {
                  const term = params.searchTerm?.toLowerCase() || "";

                  match = scenarios.find(
                    (s) =>
                      s.data.code.toLowerCase().includes(term) ||
                      s.data.title.toLowerCase().includes(term) ||
                      s.data.locationName.toLowerCase().includes(term),
                  );
                }

                if (!match) return [];

                return [
                  {
                    feature: new Graphic({
                      geometry: {
                        type: "point",
                        latitude: match.lat,
                        longitude: match.lon,
                        spatialReference: { wkid: 4326 },
                      },
                      attributes: match.data,
                    }),
                    name: `${match.data.code} - ${match.data.title}`,
                  },
                ];
              },
            },
          ],
        });

        view.ui.add(searchWidget, "top-right");

        // 👇 ADD HERE
        searchWidget.on("select-result", (event) => {
          const geom = event.result.feature.geometry;

          view.goTo({
            target: geom,
            zoom: 16,
          });

          window.ReactNativeWebView.postMessage(
            JSON.stringify({
              type: "PIN_CLICK",
              data: event.result.feature.attributes,
            }),
          );
        });
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
  </body>
</html>
