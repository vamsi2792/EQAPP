<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>EarthQuest 3D</title>

    <link
      rel="stylesheet"
      href="https://js.arcgis.com/4.29/esri/themes/dark/main.css"
    />
    <script src="https://js.arcgis.com/4.29/"></script>

    <style>
      html,
      body,
      #viewDiv {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: black;
      }
    </style>

    <script>
      require([
        "esri/WebScene",
        "esri/views/SceneView",
        "esri/widgets/Search",
        "esri/widgets/Locate",
        "esri/widgets/Compass",
        "esri/widgets/Home",
      ], function (WebScene, SceneView, Search, Locate, Compass, Home) {
        const webscene = new WebScene({
          portalItem: {
            id: "4fda049729b44251b6a9cf49a50a185a",
          },
        });

        const view = new SceneView({
          container: "viewDiv",
          map: webscene,
          qualityProfile: "high",
          padding: {
            top: 60,
          },
        });

        // 🔍 Search widget
        const searchWidget = new Search({
          view: view,
        });

        view.ui.add(searchWidget, "top-right");

        // 📍 Locate button
        const locateWidget = new Locate({
          view: view,
        });

        view.ui.add(locateWidget, "top-left");

        // 🧭 Compass
        const compassWidget = new Compass({
          view: view,
        });

        view.ui.add(compassWidget, "top-left");

        // 🏠 Home button
        const homeWidget = new Home({
          view: view,
        });

        view.ui.add(homeWidget, "top-left");
      });
    </script>
  </head>

  <body>
    <div id="viewDiv"></div>
  </body>
</html>
